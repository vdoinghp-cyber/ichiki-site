name: update-releases

on:
  schedule:
    - cron: '0 15 * * 4'      # 木曜15時UTC = 日本時間の金曜0時
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TuneCoreから新曲を取得
        run: node tools/update-releases.mjs

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/releases.js images/
          git diff --staged --quiet || git commit -m "リリース情報を更新"
          git push

      - name: サーバーへアップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /web/vdoing-coltd.com/jp/ichiki/
          exclude: |
            **/.git*
            **/.git*/**
            **/tools/**
            はじめに.txt
